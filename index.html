  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }

  .dot.used { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 0; border-top:1px solid var(--line); }

  /* Tick "giro chiuso": verde, blu nel tema già verde (albero), verde più chiaro sui temi scuri */
  :root { --tick:#1f9d55; --tick-ink:#fff; }
  :root[data-theme="scuro"], :root[data-theme="pesce"], :root[data-theme="magikarp"], :root[data-theme="turchese"], :root[data-theme="disco"], :root[data-theme="porcini"], :root[data-theme="halloween"], :root[data-theme="cervino"] { --tick:#3ddc84; --tick-ink:#062b14; }

<body>
<div id="app"><p style="padding:16px">Caricamento…</p></div>
<footer id="pfoot"><a href="privacy.html" id="plink">ⓘ Informativa privacy</a></footer>
<div id="privacy" hidden></div>

<script>
window.onerror = (m, s, l) => { document.getElementById('app').innerHTML = '<pre style="padding:16px;white-space:pre-wrap;color:#f66">Errore: ' + m + ' (riga ' + l + ')</pre>'; };

// ===== DATI PER L'INFORMATIVA PRIVACY (da completare) =====
const PRIVACY = {
  titolare: 'CAI – Club Alpino Italiano, Sezione di Merate',
  email: '',                     // email per le richieste privacy (se vuota, il testo rimanda alla palestra)
  anni: 3,                       // anni di conservazione dopo l'ultimo carnet
  aggiornata: 'ottobre 2026'
};
// ==========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById('app');
let profile = null;
let tab = 'ingressi';   // 'ingressi' | 'pareti' (il menù è visibile solo agli admin)
let wallOpen = null;    // parete aperta nella tab Pareti (null = pianta)
let editRoutes = false; // modalità "Edita giri" (sempre spenta quando si entra in una parete)

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
const STATUS = { requested:'In attesa', active:'Attivo', completed:'Completato', rejected:'Rifiutato' };

// ---------- Temi ----------
// 'auto' = predefinito (chiaro/scuro come il telefono). Un socio può avere un tema fisso (profile.theme);
// chi ha can_switch_theme sceglie dal menu, la scelta resta salvata su questo telefono.
const THEMES = { auto:'Predefinito', chiaro:'Chiaro', scuro:'Scuro', rosa:'Rosa con fiorellini 🌸', pesce:'Pesciolino 🐟', magikarp:'Magikarp 🌊', albero:'Tree climber 🌳', turchese:'Turchese e note 🎵', gattini:'Gattini 🐱', casuale:'Sorpresa del giorno 🎲', disco:'Disco anni 80 🪩', girasoli:'Girasoli 🌻', porcini:'Porcini 🍄', natale:'Natale 🎄', halloween:'Halloween 🎃', aprile:'Pesce d\'aprile 🐠', cervino:'Cervino ⛰️' };
const THEME_COLOR = { auto:'#164e70', chiaro:'#164e70', scuro:'#164e70', rosa:'#e0508a', pesce:'#0b2a3d', magikarp:'#14202b', albero:'#cfe8f7', turchese:'#10282c', gattini:'#f08a5d', casuale:'#164e70', disco:'#1a0b3b', girasoli:'#e8a317', porcini:'#1e1a12', natale:'#1b2a52', halloween:'#1a1038', aprile:'#7fd3f0', cervino:'#1d2b5a' };
// Temi di stagione: valgono per tutti e hanno la precedenza su quello personale (ora italiana)
let sessionTheme = null;   // scelta temporanea nei periodi festivi: non viene salvata, alla riapertura torna il tema di stagione
function seasonalTheme() {
  const md = new Date().toLocaleDateString('sv-SE', { timeZone:'Europe/Rome' }).slice(5);   // 'MM-DD'
  if (md >= '10-25' && md <= '10-31') return 'halloween';
  if (md >= '12-23' || md <= '01-06') return 'natale';
  if (md === '04-01') return 'aprile';
  return null;
}
function currentTheme() {
  if (!profile) return 'auto';
  const season = seasonalTheme();
  if (season) return (profile.can_switch_theme && sessionTheme) ? sessionTheme : season;   // chi può cambiare tema lo fa solo per questa apertura
  if (profile.theme && THEMES[profile.theme]) return profile.theme;
  if (profile.can_switch_theme) {
    let t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t && THEMES[t]) return t;
  }
  return 'auto';
}
// 'casuale': ogni giorno un tema diverso (uguale per tutta la giornata, ora italiana), scelto tra quelli decorativi
const RANDOM_POOL = ['rosa','pesce','magikarp','albero','turchese','gattini','disco','girasoli','porcini','natale','halloween','aprile','cervino'];
function themeOfTheDay() {
  const day = new Date().toLocaleDateString('sv-SE', { timeZone:'Europe/Rome' });
  const key = day + (profile ? profile.id : '');
  let h = 0;
  for (let i = 0; i < key.length; i++) h = Math.imul(h ^ key.charCodeAt(i), 2654435761) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0; h ^= h >>> 13; h = Math.imul(h, 3266489917) >>> 0; h ^= h >>> 16;
  return RANDOM_POOL[(h >>> 0) % RANDOM_POOL.length];
}
function applyTheme() {
  let t = currentTheme();
  if (t === 'casuale') t = themeOfTheDay();
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = THEME_COLOR[t];
}
// Pulsante con la sola tavolozza (a sinistra di "Esci"), visibile solo a chi può cambiare tema
function themeBtn() {
  return (profile && profile.can_switch_theme)
    ? '<button class="ghost" id="thbtn" title="Tema" aria-label="Cambia tema">🎨</button>' : '';
}
function themeMenu() {
  return (profile && profile.can_switch_theme) ? '<div id="thmenu" hidden></div>' : '';
}
document.addEventListener('click', () => {
  const m = document.getElementById('thmenu');
  if (m) m.hidden = true;
});
function wireTheme() {
  const b = document.getElementById('thbtn'), m = document.getElementById('thmenu');
  if (!b || !m) return;
  b.onclick = e => {
    e.stopPropagation();
    const cur = currentTheme();
    m.innerHTML = Object.entries(THEMES).map(([k, v]) =>
      `<button data-t="${k}" class="${k === cur ? 'sel' : ''}">${v}</button>`).join('');
    m.hidden = !m.hidden;
  };
  m.onclick = e => {
    const t = e.target.closest('button[data-t]');
    if (!t) return;
    if (seasonalTheme()) sessionTheme = t.dataset.t;      // periodo festivo: scelta valida finché l'app resta aperta
    else {
      try { localStorage.setItem('theme', t.dataset.t); } catch (err) {}
      profile.theme = null;           // il menu vale per chi può scegliere
    }
    applyTheme();
  };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.style.bottom = profile ? '76px' : '20px';   // sopra il menù in basso
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500);
}

async function rpc(fn, args) {
  const { error } = await sb.rpc(fn, args);
  if (error) { toast(error.message); return false; }
  return true;
}

// ---------- Auth ----------
async function login() {
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
}
async function logout() { await sb.auth.signOut(); }

// ---------- Informativa privacy ----------
function openPrivacy() {
  const p = document.getElementById('privacy');
  const t = esc(PRIVACY.titolare);
  const contatto = PRIVACY.email ? `scrivi a <b>${esc(PRIVACY.email)}</b>` : 'rivolgiti alla palestra';
  p.innerHTML = `<div class="wrap">
    <button class="ghost" id="pclose">← Indietro</button>
    <h1>Informativa sulla privacy</h1>
    <p class="muted">Ai sensi degli artt. 13 e 14 del Regolamento UE 2016/679 (GDPR). Aggiornata a ${esc(PRIVACY.aggiornata)}.</p>

    <h3>Chi è il titolare del trattamento</h3>
    <p><b>${t}</b>. Per qualsiasi domanda sui tuoi dati ${contatto}.</p>

    <h3>Quali dati trattiamo</h3>
    <ul>
      <li>Nome, cognome ed email del tuo account Google (il login avviene tramite Google: non conosciamo né salviamo la tua password).</li>
      <li>I tuoi carnet (richiesta, approvazione, stato) e le date dei tuoi ingressi, comprese quelle eventualmente registrate da un amministratore.</li>
      <li>Se il tesseramento è stato inserito dalla palestra, i dati indicati in quella fase (nome, cognome, email).</li>
      <li>Lo stato del rinnovo annuale della tessera.</li>
    </ul>
    <p><b>Posizione.</b> Quando richiedi un carnet o segni un ingresso, il telefono invia la posizione solo per verificare che tu sia in palestra. La posizione <b>non viene salvata</b>: serve per un controllo istantaneo e poi viene scartata.</p>

    <h3>Perché li trattiamo</h3>
    <p>Per gestire il tuo tesseramento e i tuoi carnet da 12 ingressi: verificare gli ingressi, evitare doppie registrazioni e gestire i rinnovi. La base giuridica è l'esecuzione del rapporto con la palestra (art. 6.1.b GDPR). Non serve un consenso e non facciamo marketing né profilazione.</p>

    <h3>Per quanto tempo li conserviamo</h3>
    <p>Finché sei socio e per ${esc(PRIVACY.anni)} anni dopo l'ultimo carnet, poi vengono cancellati. Le richieste di carnet non approvate si cancellano da sole dopo 5 minuti.</p>

    <h3>Chi può vederli</h3>
    <p>Solo tu e gli amministratori della palestra. Per far funzionare il servizio ci affidiamo a fornitori che trattano i dati per nostro conto: <b>Supabase</b> (database e accesso), <b>Google</b> (login) e <b>GitHub</b> (pubblicazione di questa pagina). Alcuni di questi fornitori possono trattare dati anche fuori dall'Unione Europea, con le garanzie previste dal GDPR (ad esempio le clausole contrattuali standard). Una copia di sicurezza dei dati viene inviata ogni settimana a un indirizzo email del titolare. Non vendiamo né cediamo i dati a terzi.</p>

    <h3>Cookie</h3>
    <p>Usiamo solo l'archiviazione tecnica del browser necessaria a mantenerti collegato. Non usiamo cookie di profilazione, statistiche o pubblicità, quindi non serve alcun banner.</p>

    <h3>I tuoi diritti</h3>
    <p>Puoi chiedere in qualsiasi momento di accedere ai tuoi dati, correggerli, cancellarli, limitarne il trattamento, riceverli in formato leggibile o opporti al trattamento: ${contatto}. Se ritieni che i tuoi dati non siano trattati correttamente puoi presentare reclamo al Garante per la protezione dei dati personali (<b>www.garanteprivacy.it</b>).</p>
  </div>`;
  p.hidden = false; p.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.getElementById('pclose').onclick = closePrivacy;
}
function closePrivacy() {
  document.getElementById('privacy').hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('plink').onclick = e => { e.preventDefault(); openPrivacy(); };

// ---------- Installazione come app (PWA) ----------
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; wireInstall(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; wireInstall(); });
function wireInstall() {
  const b = document.getElementById('inst');
  if (!b) return;
  const show = deferredInstall && !isStandalone();
  const box = document.getElementById('instbox');
  if (box) box.style.display = show ? '' : 'none'; else b.style.display = show ? '' : 'none';
  b.onclick = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice.catch(() => {});
    deferredInstall = null; wireInstall();
  };
}
function iosHint() {
  return (isIOS() && !isStandalone())
    ? '<p class="muted">Per installare l\'app su iPhone: tocca <b>Condividi</b> e poi <b>Aggiungi a Home</b>.</p>' : '';
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

function renderLogin() {
  $app.innerHTML = `<div class="center"><h1>🧗 Carnet Palestra</h1>
    <p class="muted">Accedi per gestire i tuoi ingressi</p>
    <button id="g">Accedi con Google</button>
    <p><button class="ghost" id="inst" style="display:none">📲 Installa l'app</button></p>
    <p class="muted" style="margin-top:16px;font-size:12px">Accedendo, dichiari di aver letto l'<a href="#" id="plogin" style="color:inherit">informativa privacy</a>.</p>
    ${iosHint()}</div>`;
  document.getElementById('g').onclick = login;
  document.getElementById('plogin').onclick = e => { e.preventDefault(); openPrivacy(); };
  wireInstall();
}

function shell(inner) {
  const nav = `<nav>
      <button data-tab="ingressi" class="ghost ${tab === 'ingressi' ? 'on' : ''}">🎟️ Ingressi</button>
      <button data-tab="pareti" class="ghost ${tab === 'pareti' ? 'on' : ''}">🧗 Pareti</button>
    </nav>`;
  document.body.style.paddingBottom = '64px';
  $app.innerHTML = `<header><div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><h1>Tap and Climb</h1></div>
    <div class="hactions">${themeBtn()}<button class="ghost" id="out">Esci</button></div>${themeMenu()}</header>
    <main>${inner}
    <div class="tip" id="instbox" style="display:none"><span>📲 Se preferisci installa l'app</span>
    <button class="ghost" id="inst">Installa</button></div></main>${nav}`;
  document.getElementById('out').onclick = logout;
  document.querySelectorAll('nav [data-tab]').forEach(b => b.onclick = () => {
    clearTimeout(renderUser._t);
    go(b.dataset.tab, null);
  });
  wireInstall();

}

// Navigazione con cronologia del browser: "indietro" torna alla schermata precedente invece di chiudere l'app
function go(t, w) {
  if (t === tab && w === wallOpen) return route();
  tab = t; wallOpen = w; editRoutes = false;
  try { history.pushState({ tab: t, wall: w }, ''); } catch (e) {}
  route();
}
window.addEventListener('popstate', e => {
  if (!profile) return;
  const st = e.state || {};
  tab = st.tab === 'pareti' ? 'pareti' : 'ingressi';
  wallOpen = tab === 'pareti' ? (st.wall || null) : null;
  editRoutes = false;
  clearTimeout(renderUser._t);
  route();
});

// Mostra la schermata giusta in base alla tab (i non-admin vedono sempre "Ingressi")
function route() {
  document.getElementById('tdlg')?.remove();   // chiude la finestra della tick se si cambia pagina
  const pareti = !!(profile && tab === 'pareti');
  if (!pareti) tab = 'ingressi';
  document.getElementById('pfoot').style.display = pareti ? 'none' : '';   // informativa privacy: solo su Ingressi
  return pareti ? (wallOpen ? renderParete(wallOpen) : renderPareti()) : renderUser();
}

// ---------- Tab "Pareti" (solo admin): palestra vista dall'alto ----------
// Blocco centrale rettangolare (pareti 1-8) con la grotta (4) rientrata a destra: 5 e 3 sono allineate e uguali, 8 è lunga come la grotta.
// Dietro: pannello 9 a sinistra e pannelli 10 e 11 sulla stessa linea, che occupano 2/3 della parete in alto.
// Ogni parete è un link: si apre la sua pagina (per ora una bozza).
const WALL_NAMES = { 1:'Spigolo nord ovest', 2:'Parete ovest', 3:'Spigolo sud ovest', 4:'Grotta', 5:'Spigolo sud est', 6:'Parete est', 7:'Spigolo nord est', 8:'Parete nord', 9:'Pinnacolo verde', 10:'Decoy Board', 11:'Moonboard' };
// Descrizione mostrata in cima alla pagina di alcune pareti
const WALL_INFO = {
  6: 'Spray wall: una parete coperta di prese senza percorsi segnati. I percorsi te li inventi tu, scegliendo le prese che vuoi usare.',
  10: 'Pannello inclinato a 45°. La Decoy Board è un pannello standard con le prese sempre nella stessa posizione in tutto il mondo: i boulder si scelgono dall\'app Decoyboard.',
  11: 'Pannello inclinato a 25°. La MoonBoard è un pannello standard con le prese sempre nella stessa posizione in tutto il mondo: i boulder si scelgono dall\'app MoonBoard.'
};
// Avvisi in evidenza in cima alla pagina di una parete
const WALL_ALERT = { 4: 'Obbligatorio usare come piedi solo le piccole prese bianche. Eccetto per piramide e tallonate.' };
// Link di download delle app dei pannelli
const WALL_APPS = {
  10: { ios:'https://apps.apple.com/us/app/decoy-board/id1539249879', android:'https://play.google.com/store/apps/details?id=com.auroraclimbing.decoyboard', name:'Decoyboard' },
  11: { ios:'https://apps.apple.com/us/app/moon-board/id6446842142', android:'https://play.google.com/store/apps/details?id=com.trainingboard.moon', name:'MoonBoard' }
};
// Rileva il telefono (iPadOS si presenta come Mac con touch)
const isAndroid = () => /android/i.test(navigator.userAgent);
const isApple = () => isIOS() || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const NO_GIRI = ['6', '10', '11'];   // pannelli senza giri: solo la descrizione
function renderPareti() {
  const walls = [   // [numero, x1, y1, x2, y2]
    [1, 70,590, 70,459], [8, 70,459, 70,311], [7, 70,311, 70,180],
    [6, 70,180, 260,180],
    [5, 260,180, 260,311], [4, 238,311, 238,459], [3, 260,459, 260,590],
    [2, 260,590, 70,590],
    [9, 20,40, 20,140], [10, 127,40, 230,40], [11, 238,40, 340,40]
  ];
  const gap = 1.5;   // piccolo stacco tra pareti vicine, così si vede dove finisce una e inizia l'altra
  const trim = w => {
    const dx = w[3] - w[1], dy = w[4] - w[2], len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    return [w[1] + ux * gap, w[2] + uy * gap, w[3] - ux * gap, w[4] - uy * gap];
  };
  const svg = `<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid meet" style="width:100%;height:calc(100vh - 170px);height:calc(100dvh - 170px);display:block" role="group" aria-label="Pianta della palestra vista dall'alto">
    <polygon points="70,180 260,180 260,311 238,311 238,459 260,459 260,590 70,590" fill="var(--line)" fill-opacity=".45"/>
    <path d="M260 311H238M238 459H260" stroke="var(--muted)" stroke-width="3" fill="none"/>
    ${walls.map(w => {
      const t = trim(w), x = (w[1] + w[3]) / 2, y = (w[2] + w[4]) / 2;
      return `<g class="wall" data-w="${w[0]}" role="link" tabindex="0" aria-label="Apri ${esc(WALL_NAMES[w[0]])}">
        <line class="hit" x1="${t[0]}" y1="${t[1]}" x2="${t[2]}" y2="${t[3]}"/>
        <line class="bar" x1="${t[0]}" y1="${t[1]}" x2="${t[2]}" y2="${t[3]}" stroke="var(--accent)" stroke-width="8" stroke-linecap="butt"/>
        <circle class="pulse" cx="${x}" cy="${y}" r="15"/>
        <circle class="badge" cx="${x}" cy="${y}" r="15" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>
        <text x="${x}" y="${y + 5.5}" font-size="16" font-weight="700" text-anchor="middle" fill="#fff" pointer-events="none">${w[0]}</text>
      </g>`;
    }).join('')}
  </svg>`;
  shell(`<div id="wveil"></div><div class="whint">👆 Tocca una parete per vedere i giri</div>${svg}`);
  // la pianta occupa tutta la pagina: niente margini né suggerimento di installazione
  document.querySelector('main').style.padding = '0';
  document.getElementById('instbox')?.remove();
  const open = g => go('pareti', g.dataset.w);
  document.querySelectorAll('.wall').forEach(g => {
    g.onclick = () => open(g);
    g.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(g); } };
  });
}

// Giri delle pareti: salvati nella tabella "routes" di Supabase (solo admin). Forme: c = cerchio, q = quadrato, t = triangolo, e = esagono.
const COLORS = { verde:'#2e9e4f', arancio:'#f28a1a', giallo:'#f2d21b', blu:'#1448ff', 'blu scuro':'#1a2f94', nero:'#111111', azzurro:'#4db8f0', rosso:'#d93030', fucsia:'#e0189a', 'verde chiaro':'#8fd96b', 'verde scuro':'#1b6b34', viola:'#8a3fd1', marrone:'#8a5a32', beige:'#e8d6b0', rosa:'#f59ac0', bianco:'#ffffff' };
const SHAPE_NAMES = { c:'cerchio', q:'quadrato', t:'triangolo', e:'esagono' };
// Scala francese, dal 5c in su
const GRADES = ['5c','6a','6a+','6b','6b+','6c','6c+','7a','7a+','7b','7b+','7c','7c+','8a','8a+','8b','8b+','8c','8c+','9a','9a+','9b','9b+','9c'];
const gradeRank = g => { const i = GRADES.indexOf(g); return g ? (i < 0 ? -1 : i) : 999; };   // senza grado in fondo
function shapeIcon(sh, color) {
  const f = COLORS[color] || '#888', a = `fill="${f}" stroke="var(--muted)" stroke-width="1.2"`;
  const g = sh === 'e' ? `<polygon points="11,2 18.8,6.5 18.8,15.5 11,20 3.2,15.5 3.2,6.5" stroke-linejoin="round" ${a}/>` : sh === 'c' ? `<circle cx="11" cy="11" r="8" ${a}/>` : sh === 'q' ? `<rect x="3" y="3" width="16" height="16" rx="1.5" ${a}/>` : `<polygon points="11,2.5 20,19 2,19" stroke-linejoin="round" ${a}/>`;
  return `<svg viewBox="0 0 22 22" width="26" height="26" style="flex:none" role="img" aria-label="${SHAPE_NAMES[sh]} ${esc(color)}">${g}</svg>`;
}

// Tick "giro chiuso": icona e finestra di conferma
const tickIcon = (size, color = 'var(--tick)') => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" role="img" aria-label="Giro chiuso"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="${color}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function tickDialog(g, isTicked, onDone) {
  document.getElementById('tdlg')?.remove();
  const d = document.createElement('div');
  d.id = 'tdlg';
  d.innerHTML = `<div class="card" role="dialog" aria-modal="true" aria-label="${esc(g.name)}" style="width:100%;max-width:360px;margin:0;text-align:center">
      <div style="display:flex;justify-content:center;margin-bottom:6px">${shapeIcon(g.shape, g.color)}</div>
      <h2 style="margin:0 0 2px;font-size:19px">${esc(g.name)}</h2>
      <div class="muted" style="margin-bottom:18px">${esc(SHAPE_NAMES[g.shape])} ${esc(g.color)}${g.grade ? ' · ' + esc(g.grade) : ''}</div>
      ${isTicked
        ? `<button class="big bad" id="tact" style="margin-bottom:10px">Non l'ho chiuso</button>`
        : `<button class="big ok" id="tact" style="margin-bottom:10px;background:var(--tick);color:var(--tick-ink)">Segna come chiuso</button>`}
      <button class="ghost" id="tclose" style="width:100%">${isTicked ? 'Chiudi' : 'Annulla'}</button></div>`;
  document.body.appendChild(d);
  const close = () => { d.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  d.onclick = e => { if (e.target === d) close(); };
  document.getElementById('tclose').onclick = close;
  document.getElementById('tact').onclick = async ev => {
    ev.currentTarget.disabled = true;
    const { error } = isTicked ? await sb.from('route_ticks').delete().eq('route_id', g.id)
                               : await sb.from('route_ticks').insert({ route_id: g.id });
    if (error && !(error.code === '23505' && !isTicked)) { toast(error.message); ev.currentTarget.disabled = false; return; }
    close(); toast(isTicked ? 'Tick tolta' : 'Giro chiuso ✅'); onDone();
  };
}

// Pagina di una singola parete: "Indietro" a sinistra, nome a destra, sotto l'elenco dei giri (si aggiungono, modificano e tolgono da qui)
async function renderParete(n, edit = null) {
  n = String(n);
  shell(`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px">
      <button class="ghost" id="wback">← Indietro</button>
      <h2 style="margin:0;font-size:20px;text-align:right">${esc(WALL_NAMES[n] || 'Parete ' + n)}</h2></div>
    <div class="card" id="wbody" style="min-height:50vh"><p class="muted">Caricamento…</p></div>`);
  document.getElementById('wback').onclick = () => { if (history.state && history.state.wall) history.back(); else go('pareti', null); };

  if (NO_GIRI.includes(n)) {
    const app = WALL_APPS[n];
    // su iPhone/iPad solo App Store, su Android solo Google Play; altrove (computer) entrambi
    const stores = !app ? [] : isApple() ? [['ios', 'Scarica per iPhone']] : isAndroid() ? [['android', 'Scarica per Android']] : [['ios', 'Scarica per iPhone'], ['android', 'Scarica per Android']];
    document.getElementById('wbody').innerHTML = `<p style="margin:0 0 16px;padding:12px;border-radius:10px;background:var(--line);line-height:1.45">${esc(WALL_INFO[n] || '')}</p>
      ${stores.map(([k, label]) => `<button class="big wstore" data-url="${esc(app[k])}" style="margin-bottom:10px">${label} ${esc(app.name)}</button>`).join('')}`;
    document.querySelectorAll('.wstore').forEach(b => b.onclick = () => window.open(b.dataset.url, '_blank', 'noopener'));
    return;
  }
  const { data, error } = await sb.from('routes').select('*').eq('wall', Number(n)).order('position').order('created_at');
  if (tab !== 'pareti' || wallOpen !== n) return;   // nel frattempo hai cambiato pagina
  const body = document.getElementById('wbody');
  if (error) { body.innerHTML = '<p class="muted">Impossibile caricare i giri.</p>'; return toast(error.message); }
  const giri = (data || []).slice().sort((a, b) => gradeRank(a.grade) - gradeRank(b.grade) || a.position - b.position || a.name.localeCompare(b.name));

  if (edit) {
    const r = edit === 'new' ? null : giri.find(g => g.id === edit);
    const v = k => esc(r ? (r[k] ?? '') : '');
    body.innerHTML = `<h2>${r ? 'Modifica giro' : 'Nuovo giro'}</h2>
      <input id="fname" placeholder="Nome del giro" value="${v('name')}" autocomplete="off">
      <select id="fgrade"><option value="">Grado non indicato</option>${(r && r.grade && !GRADES.includes(r.grade) ? [r.grade] : []).concat(GRADES).map(x => `<option value="${esc(x)}" ${r && r.grade === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <select id="fshape">${Object.entries(SHAPE_NAMES).map(([k, t]) => `<option value="${k}" ${r && r.shape === k ? 'selected' : ''}>${t}</option>`).join('')}</select>
      <select id="fcolor">${Object.keys(COLORS).map(c => `<option value="${c}" ${r && r.color === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <input id="fnote" placeholder="Nota (facoltativa)" value="${v('note')}" autocomplete="off">
      <div class="actions"><button class="big ok" id="fsave">Salva</button><button class="ghost" id="fcancel">Annulla</button></div>
      ${r ? '<p style="text-align:center"><button class="ghost" id="fdel" style="color:var(--bad)">Elimina giro</button></p>' : ''}`;
    document.getElementById('fcancel').onclick = () => renderParete(n);
    document.getElementById('fsave').onclick = async ev => {
      const name = document.getElementById('fname').value.trim();
      if (!name) return toast('Inserisci il nome del giro');
      const row = { wall: Number(n), name, grade: document.getElementById('fgrade').value.trim() || null,
        shape: document.getElementById('fshape').value, color: document.getElementById('fcolor').value,
        note: document.getElementById('fnote').value.trim() || null };
      ev.currentTarget.disabled = true;
      const { error: e } = r ? await sb.from('routes').update(row).eq('id', r.id)
        : await sb.from('routes').insert({ ...row, position: giri.reduce((m, g) => Math.max(m, g.position), 0) + 1 });
      if (e) { toast(e.message); ev.currentTarget.disabled = false; return; }
      toast('Giro salvato ✅'); renderParete(n);
    };
    if (r) document.getElementById('fdel').onclick = async () => {
      if (!confirm('Eliminare il giro "' + r.name + '"?')) return;
      const { error: e } = await sb.from('routes').delete().eq('id', r.id);
      if (e) return toast(e.message);
      toast('Giro eliminato'); renderParete(n);
    };
    return;
  }

  const ticked = new Set();
  if (giri.length) {
    const { data: tk } = await sb.from('route_ticks').select('route_id').in('route_id', giri.map(g => g.id));   // se la tabella manca: nessuna tick
    (tk || []).forEach(t => ticked.add(t.route_id));
    if (tab !== 'pareti' || wallOpen !== n) return;
  }
  body.innerHTML = `${WALL_ALERT[n] ? `<div role="alert" style="margin:0 0 14px;padding:12px 14px;border-radius:10px;border-left:5px solid #e5a300;background:rgba(229,163,0,.18);font-weight:600;line-height:1.4">⚠️ ${esc(WALL_ALERT[n])}</div>` : ''}${WALL_INFO[n] ? `<p style="margin:0 0 14px;padding:12px;border-radius:10px;background:var(--line);line-height:1.45">${esc(WALL_INFO[n])}</p>` : ''}${profile.is_admin ? `<div style="display:flex;gap:10px">
      <button class="big" id="fadd" style="flex:1;width:auto;padding:16px 8px;font-size:17px">＋ Aggiungi giro</button>
      <button class="big ${editRoutes ? '' : 'ghost'}" id="fedit" style="flex:1;width:auto;padding:16px 8px;font-size:17px">${editRoutes ? '✓ Fine' : 'Edita giri'}</button></div>` : ''}
    ${profile.is_admin && editRoutes && giri.length ? '<p class="muted" style="margin:10px 0 0;text-align:center">Modalità modifica: tocca un giro per modificarlo</p>' : ''}
    <div style="margin-top:8px">${giri.length ? giri.map(g => `<div class="row wroute" data-id="${esc(g.id)}" style="justify-content:flex-start;gap:10px;cursor:pointer">
      ${shapeIcon(g.shape, g.color)}
      <div style="flex:1;min-width:0"><b>${esc(g.name)}</b><div class="muted">${esc(SHAPE_NAMES[g.shape])} ${esc(g.color)}${g.note ? ' · ' + esc(g.note) : ''}</div></div>
      <span class="badge${ticked.has(g.id) ? ' tickdone' : ''}" style="font-size:14px;font-weight:700">${ticked.has(g.id) ? tickIcon(15, 'var(--tick-ink)') : ''}${g.grade ? esc(g.grade) : '—'}</span></div>`).join('')
      : '<p class="muted">Nessun giro in elenco.</p>'}</div>`;
  if (profile.is_admin) {   // solo gli admin aggiungono e modificano i giri
    document.getElementById('fadd').onclick = () => renderParete(n, 'new');
    document.getElementById('fedit').onclick = () => { editRoutes = !editRoutes; renderParete(n); };
  }
  // al tocco: con "Edita giri" acceso si apre la modifica, altrimenti la finestra per mettere o togliere la tick
  document.querySelectorAll('.wroute').forEach(el => el.onclick = () => {
    if (editRoutes && profile.is_admin) return renderParete(n, el.dataset.id);
    const g = giri.find(x => x.id === el.dataset.id);
    if (g) tickDialog(g, ticked.has(g.id), () => renderParete(n));
  });
}

// Posizione del telefono (serve solo per verificare che l'utente sia in palestra; non viene salvata)
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition(p => resolve(p.coords), reject,
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

// ---------- Utente ----------
async function renderUser() {
  let { data: carnets, error } = await sb.from('carnets')
    .select('*, entries(entry_date)').eq('user_id', profile.id)
    .order('requested_at', { ascending:false });
  if (error) { toast(error.message); return; }
  if (tab !== 'ingressi') return;   // nel frattempo si è cambiata tab

  const EXP = 5 * 60 * 1000;
  const left = c => EXP - (Date.now() - new Date(c.requested_at).getTime());
  clearTimeout(renderUser._t);
  carnets = carnets.filter(c => !(c.status === 'requested' && left(c) <= 0)); // richieste scadute: ignorate
  const open = carnets.find(c => ['requested','active'].includes(c.status));
  const today = new Date().toLocaleDateString('sv-SE', { timeZone:'Europe/Rome' });
  let top = '';

  if (!open) {
    top = `<div class="card"><h2>Nessun carnet attivo</h2>
      <button class="big" id="req">Richiedi un carnet da 12 ingressi</button></div>`;
  } else if (open.status === 'requested') {
    const mins = Math.max(1, Math.ceil(left(open) / 60000));
    top = `<div class="card"><h2>Richiesta in attesa ⏳</h2>
      <p class="muted">Un amministratore la approverà a breve. Se non viene confermata entro ${mins} min, la richiesta si annulla da sola.</p></div>`;
    renderUser._t = setTimeout(() => { if (tab === 'ingressi') renderUser(); }, Math.max(1000, left(open) + 1000));
  } else {
    const used = open.entries.length;
    const doneToday = open.entries.some(e => e.entry_date === today);
    const dots = Array.from({ length: open.total_entries }, (_, i) =>
      `<div class="dot ${i < used ? 'used' : ''}">${i + 1}</div>`).join('');
    top = `<div class="card"><h2>Carnet attivo: ${used}/${open.total_entries} ingressi</h2>
      <div class="dots">${dots}</div>
      <button class="big" id="enter" ${doneToday ? 'disabled' : ''}>
        ${doneToday ? '✅ Ingresso di oggi già segnato' : 'Segna ingresso di oggi'}</button></div>`;
  }

  const history = carnets.length ? carnets.map(c => {
    const dates = c.entries.map(e => e.entry_date).sort();
    return `<details class="row" style="display:block">
      <summary><b>Carnet del ${fmtDate(c.requested_at)}</b>
        <span class="badge ${c.status}">${STATUS[c.status]}</span>
        <span class="muted"> ${c.entries.length}/${c.total_entries}</span></summary>
      <div class="muted" style="margin-top:8px">${dates.length
        ? dates.map(d => `• ${fmtDate(d)}`).join('<br>') : 'Nessun ingresso'}</div></details>`;
  }).join('') : '<p class="muted">Nessun carnet ancora.</p>';

  shell(`${top}<div class="card"><h2>Storico carnet</h2>${history}</div>`);

  document.getElementById('req')?.addEventListener('click', async (ev) => {
    const b = ev.currentTarget, label = b.textContent;
    b.disabled = true; b.textContent = '📍 Controllo la posizione…';
    try {
      const pos = await getPosition();
      if (await rpc('request_carnet', { p_lat: pos.latitude, p_lng: pos.longitude, p_accuracy: pos.accuracy })) return renderUser();
    } catch (e) {
      toast(e.code === 1 ? 'Per richiedere il carnet devi consentire l\'accesso alla posizione nelle impostazioni del browser'
          : e.code === 3 ? 'Posizione non trovata in tempo: riprova all\'aperto o attiva il GPS'
          : 'Impossibile leggere la posizione: attiva la localizzazione e riprova');
    }
    b.disabled = false; b.textContent = label;
  });
  document.getElementById('enter')?.addEventListener('click', async (ev) => {
    const b = ev.currentTarget, label = b.textContent;
    b.disabled = true; b.textContent = '📍 Controllo la posizione…';
    try {
      const pos = await getPosition();
      if (await rpc('register_entry', { p_lat: pos.latitude, p_lng: pos.longitude, p_accuracy: pos.accuracy })) {
        toast('Ingresso registrato ✅'); return renderUser();
      }
    } catch (e) {
      toast(e.code === 1 ? 'Per segnare l\'ingresso devi consentire l\'accesso alla posizione nelle impostazioni del browser'
          : e.code === 3 ? 'Posizione non trovata in tempo: riprova all\'aperto o attiva il GPS'
          : 'Impossibile leggere la posizione: attiva la localizzazione e riprova');
    }
    b.disabled = false; b.textContent = label;
  });
}

// ---------- Avvio ----------

      profile.name_confirmed = true;
      profile.full_name = fn + ' ' + ln;
      route();
    }
  };
}

async function init(session) {
  if (!session) { profile = null; tab = 'ingressi'; wallOpen = null; document.body.style.paddingBottom = ''; document.getElementById('pfoot').style.display = ''; applyTheme(); return renderLogin(); }
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error) { toast(error.message); return renderLogin(); }
  profile = data;
  applyTheme();
  if (!profile.name_confirmed) return renderNameForm();
  try { history.replaceState({ tab: 'ingressi', wall: null }, ''); } catch (e) {}
  route();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
    setTimeout(() => init(session), 0);
  }
});
</script>
