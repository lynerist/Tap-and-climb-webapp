<body>
<div id="app"><p style="padding:16px">Caricamento…</p></div>
<footer id="pfoot"><a href="#" id="plink">ⓘ Informativa privacy</a></footer>
<div id="privacy" hidden></div>
<div id="toast"></div>

<script>
window.onerror = (m, s, l) => { document.getElementById('app').innerHTML = '<pre style="padding:16px;white-space:pre-wrap;color:#f66">Errore: ' + m + ' (riga ' + l + ')</pre>'; };

// ===== DATI PER L'INFORMATIVA PRIVACY (da completare) =====
const PRIVACY = {
  titolare: 'CAI – Club Alpino Italiano, Sezione di Merate',
  email: '',                     // email per le richieste privacy (se vuota, il testo rimanda alla palestra)
  anni: 3,                       // anni di conservazione dopo l'ultimo carnet
  aggiornata: 'ottobre 2026'
};
// ==========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $app = document.getElementById('app');
let profile = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
const STATUS = { requested:'In attesa', active:'Attivo', completed:'Completato', rejected:'Rifiutato' };

// ---------- Temi ----------
// 'auto' = predefinito (chiaro/scuro come il telefono). Un socio può avere un tema fisso (profile.theme);
// chi ha can_switch_theme sceglie dal menu, la scelta resta salvata su questo telefono.
const THEMES = { auto:'Predefinito', chiaro:'Chiaro', scuro:'Scuro', rosa:'Rosa con fiorellini 🌸', pesce:'Pesciolino 🐟', cai:'CAI ⛰️', magikarp:'Magikarp 🌊', palestra:'Palestra 🧗', albero:'Tree climber 🌳', turchese:'Turchese e note 🎵' };
const THEME_COLOR = { auto:'#164e70', chiaro:'#164e70', scuro:'#164e70', rosa:'#e0508a', pesce:'#0b2a3d', cai:'#0a2342', magikarp:'#14202b', palestra:'#1f2328', albero:'#cfe8f7', turchese:'#10282c' };
function currentTheme() {
  if (!profile) return 'auto';
  if (profile.theme && THEMES[profile.theme]) return profile.theme;
  if (profile.can_switch_theme) {
    let t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t && THEMES[t]) return t;
  }
  return 'auto';
}
function applyTheme() {
  const t = currentTheme();
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = THEME_COLOR[t];
}
// Pulsante con la sola tavolozza (a sinistra di "Esci"), visibile solo a chi può cambiare tema
function themeBtn() {
  return (profile && profile.can_switch_theme)
    ? '<button class="ghost" id="thbtn" title="Tema" aria-label="Cambia tema">🎨</button>' : '';
}
function themeMenu() {
  return (profile && profile.can_switch_theme) ? '<div id="thmenu" hidden></div>' : '';
}
document.addEventListener('click', () => {
  const m = document.getElementById('thmenu');
  if (m) m.hidden = true;
});
function wireTheme() {
  const b = document.getElementById('thbtn'), m = document.getElementById('thmenu');
  if (!b || !m) return;
  b.onclick = e => {
    e.stopPropagation();
    const cur = currentTheme();
    m.innerHTML = Object.entries(THEMES).map(([k, v]) =>
      `<button data-t="${k}" class="${k === cur ? 'sel' : ''}">${v}</button>`).join('');
    m.hidden = !m.hidden;
  };
  m.onclick = e => {
    const t = e.target.closest('button[data-t]');
    if (!t) return;
    try { localStorage.setItem('theme', t.dataset.t); } catch (err) {}
    profile.theme = null;           // il menu vale per chi può scegliere
    applyTheme();
  };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', 3500);
}

async function rpc(fn, args) {
  const { error } = await sb.rpc(fn, args);
  if (error) { toast(error.message); return false; }
  return true;
}

// ---------- Auth ----------
async function login() {
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname } });
}
async function logout() { await sb.auth.signOut(); }

// ---------- Informativa privacy ----------
function openPrivacy() {
  const p = document.getElementById('privacy');
  const t = esc(PRIVACY.titolare);
  const contatto = PRIVACY.email ? `scrivi a <b>${esc(PRIVACY.email)}</b>` : 'rivolgiti alla palestra';
  p.innerHTML = `<div class="wrap">
    <button class="ghost" id="pclose">← Indietro</button>
    <h1>Informativa sulla privacy</h1>
    <p class="muted">Ai sensi degli artt. 13 e 14 del Regolamento UE 2016/679 (GDPR). Aggiornata a ${esc(PRIVACY.aggiornata)}.</p>

    <h3>Chi è il titolare del trattamento</h3>
    <p><b>${t}</b>. Per qualsiasi domanda sui tuoi dati ${contatto}.</p>

    <h3>Quali dati trattiamo</h3>
    <ul>
      <li>Nome, cognome ed email del tuo account Google (il login avviene tramite Google: non conosciamo né salviamo la tua password).</li>
      <li>I tuoi carnet (richiesta, approvazione, stato) e le date dei tuoi ingressi, comprese quelle eventualmente registrate da un amministratore.</li>
      <li>Se il tesseramento è stato inserito dalla palestra, i dati indicati in quella fase (nome, cognome, email).</li>
      <li>Lo stato del rinnovo annuale della tessera.</li>
    </ul>
    <p><b>Posizione.</b> Quando richiedi un carnet o segni un ingresso, il telefono invia la posizione solo per verificare che tu sia in palestra. La posizione <b>non viene salvata</b>: serve per un controllo istantaneo e poi viene scartata.</p>

    <h3>Perché li trattiamo</h3>
    <p>Per gestire il tuo tesseramento e i tuoi carnet da 12 ingressi: verificare gli ingressi, evitare doppie registrazioni e gestire i rinnovi. La base giuridica è l'esecuzione del rapporto con la palestra (art. 6.1.b GDPR). Non serve un consenso e non facciamo marketing né profilazione.</p>

    <h3>Per quanto tempo li conserviamo</h3>
    <p>Finché sei socio e per ${esc(PRIVACY.anni)} anni dopo l'ultimo carnet, poi vengono cancellati. Le richieste di carnet non approvate si cancellano da sole dopo 5 minuti.</p>

    <h3>Chi può vederli</h3>
    <p>Solo tu e gli amministratori della palestra. Per far funzionare il servizio ci affidiamo a fornitori che trattano i dati per nostro conto: <b>Supabase</b> (database e accesso), <b>Google</b> (login) e <b>GitHub</b> (pubblicazione di questa pagina). Alcuni di questi fornitori possono trattare dati anche fuori dall'Unione Europea, con le garanzie previste dal GDPR (ad esempio le clausole contrattuali standard). Una copia di sicurezza dei dati viene inviata ogni settimana a un indirizzo email del titolare. Non vendiamo né cediamo i dati a terzi.</p>

    <h3>Cookie</h3>
    <p>Usiamo solo l'archiviazione tecnica del browser necessaria a mantenerti collegato. Non usiamo cookie di profilazione, statistiche o pubblicità, quindi non serve alcun banner.</p>

    <h3>I tuoi diritti</h3>
    <p>Puoi chiedere in qualsiasi momento di accedere ai tuoi dati, correggerli, cancellarli, limitarne il trattamento, riceverli in formato leggibile o opporti al trattamento: ${contatto}. Se ritieni che i tuoi dati non siano trattati correttamente puoi presentare reclamo al Garante per la protezione dei dati personali (<b>www.garanteprivacy.it</b>).</p>
  </div>`;
  p.hidden = false; p.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.getElementById('pclose').onclick = closePrivacy;
}
function closePrivacy() {
  document.getElementById('privacy').hidden = true;
  document.body.style.overflow = '';
}
document.getElementById('plink').onclick = e => { e.preventDefault(); openPrivacy(); };

// ---------- Installazione come app (PWA) ----------
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; wireInstall(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; wireInstall(); });
function wireInstall() {
  const b = document.getElementById('inst');
  if (!b) return;
  const show = deferredInstall && !isStandalone();
  const box = document.getElementById('instbox');
  if (box) box.style.display = show ? '' : 'none'; else b.style.display = show ? '' : 'none';
  b.onclick = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice.catch(() => {});
    deferredInstall = null; wireInstall();
  };
}
function iosHint() {
  return (isIOS() && !isStandalone())
    ? '<p class="muted">Per installare l\'app su iPhone: tocca <b>Condividi</b> e poi <b>Aggiungi a Home</b>.</p>' : '';
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

function renderLogin() {
  $app.innerHTML = `<div class="center"><h1>🧗 Carnet Palestra</h1>
    <p class="muted">Accedi per gestire i tuoi ingressi</p>
    <button id="g">Accedi con Google</button>
    <p><button class="ghost" id="inst" style="display:none">📲 Installa l'app</button></p>
    <p class="muted" style="margin-top:16px;font-size:12px">Accedendo, dichiari di aver letto l'<a href="#" id="plogin" style="color:inherit">informativa privacy</a>.</p>
    ${iosHint()}</div>`;
  document.getElementById('g').onclick = login;
  document.getElementById('plogin').onclick = e => { e.preventDefault(); openPrivacy(); };
  wireInstall();
}

function shell(inner) {
  $app.innerHTML = `<header><div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><h1>Tap and Climb</h1></div>
    <div class="hactions">${themeBtn()}<button class="ghost" id="out">Esci</button></div>${themeMenu()}</header>
    <main>${inner}
    <div class="tip" id="instbox" style="display:none"><span>📲 Se preferisci installa l'app</span>
    <button class="ghost" id="inst">Installa</button></div></main>`;
  document.getElementById('out').onclick = logout;
  wireInstall();
  wireTheme();
}

// Posizione del telefono (serve solo per verificare che l'utente sia in palestra; non viene salvata)
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition(p => resolve(p.coords), reject,
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

// ---------- Utente ----------
async function renderUser() {
  let { data: carnets, error } = await sb.from('carnets')
    .select('*, entries(entry_date)').eq('user_id', profile.id)
    .order('requested_at', { ascending:false });
  if (error) { toast(error.message); return; }

  const EXP = 5 * 60 * 1000;
  const left = c => EXP - (Date.now() - new Date(c.requested_at).getTime());
  clearTimeout(renderUser._t);
  carnets = carnets.filter(c => !(c.status === 'requested' && left(c) <= 0)); // richieste scadute: ignorate
  const open = carnets.find(c => ['requested','active'].includes(c.status));
  const today = new Date().toLocaleDateString('sv-SE', { timeZone:'Europe/Rome' });
  let top = '';

  if (!open) {
    top = `<div class="card"><h2>Nessun carnet attivo</h2>
      <button class="big" id="req">Richiedi un carnet da 12 ingressi</button></div>`;
  } else if (open.status === 'requested') {
    const mins = Math.max(1, Math.ceil(left(open) / 60000));
    top = `<div class="card"><h2>Richiesta in attesa ⏳</h2>
      <p class="muted">Un amministratore la approverà a breve. Se non viene confermata entro ${mins} min, la richiesta si annulla da sola.</p></div>`;
    renderUser._t = setTimeout(renderUser, Math.max(1000, left(open) + 1000));
  } else {
    const used = open.entries.length;
    const doneToday = open.entries.some(e => e.entry_date === today);
    const dots = Array.from({ length: open.total_entries }, (_, i) =>
      `<div class="dot ${i < used ? 'used' : ''}">${i + 1}</div>`).join('');
    top = `<div class="card"><h2>Carnet attivo: ${used}/${open.total_entries} ingressi</h2>
      <div class="dots">${dots}</div>
      <button class="big" id="enter" ${doneToday ? 'disabled' : ''}>
        ${doneToday ? '✅ Ingresso di oggi già segnato' : 'Segna ingresso di oggi'}</button></div>`;
  }

  const history = carnets.length ? carnets.map(c => {
    const dates = c.entries.map(e => e.entry_date).sort();
    return `<details class="row" style="display:block">
      <summary><b>Carnet del ${fmtDate(c.requested_at)}</b>
        <span class="badge ${c.status}">${STATUS[c.status]}</span>
        <span class="muted"> ${c.entries.length}/${c.total_entries}</span></summary>
      <div class="muted" style="margin-top:8px">${dates.length
        ? dates.map(d => `• ${fmtDate(d)}`).join('<br>') : 'Nessun ingresso'}</div></details>`;
  }).join('') : '<p class="muted">Nessun carnet ancora.</p>';

  shell(`${top}<div class="card"><h2>Storico carnet</h2>${history}</div>`);

  document.getElementById('req')?.addEventListener('click', async (ev) => {
    const b = ev.currentTarget, label = b.textContent;
    b.disabled = true; b.textContent = '📍 Controllo la posizione…';
    try {
      const pos = await getPosition();
      if (await rpc('request_carnet', { p_lat: pos.latitude, p_lng: pos.longitude, p_accuracy: pos.accuracy })) return renderUser();
    } catch (e) {
      toast(e.code === 1 ? 'Per richiedere il carnet devi consentire l\'accesso alla posizione nelle impostazioni del browser'
          : e.code === 3 ? 'Posizione non trovata in tempo: riprova all\'aperto o attiva il GPS'
          : 'Impossibile leggere la posizione: attiva la localizzazione e riprova');
    }
    b.disabled = false; b.textContent = label;
  });
  document.getElementById('enter')?.addEventListener('click', async (ev) => {
    const b = ev.currentTarget, label = b.textContent;
    b.disabled = true; b.textContent = '📍 Controllo la posizione…';
    try {
      const pos = await getPosition();
      if (await rpc('register_entry', { p_lat: pos.latitude, p_lng: pos.longitude, p_accuracy: pos.accuracy })) {
        toast('Ingresso registrato ✅'); return renderUser();
      }
    } catch (e) {
      toast(e.code === 1 ? 'Per segnare l\'ingresso devi consentire l\'accesso alla posizione nelle impostazioni del browser'
          : e.code === 3 ? 'Posizione non trovata in tempo: riprova all\'aperto o attiva il GPS'
          : 'Impossibile leggere la posizione: attiva la localizzazione e riprova');
    }
    b.disabled = false; b.textContent = label;
  });
}

// ---------- Avvio ----------
function renderNameForm() {
  const parts = (profile.full_name || '').trim().split(/\s+/).filter(Boolean);
  const f = parts.shift() || '';
  const l = parts.join(' ');
  $app.innerHTML = `<div class="center"><h1>🧗 Benvenuto!</h1>
    <p class="muted">Inserisci nome e cognome per completare la registrazione</p>
    <div style="max-width:320px;margin:20px auto 0;text-align:left">
      <input id="fn" placeholder="Nome" value="${esc(f)}" autocomplete="given-name">
      <input id="ln" placeholder="Cognome" value="${esc(l)}" autocomplete="family-name">
      <button class="big" id="save">Continua</button>
    </div></div>`;
  document.getElementById('save').onclick = async () => {
    const fn = document.getElementById('fn').value.trim();
    const ln = document.getElementById('ln').value.trim();
    if (!fn || !ln) return toast('Inserisci nome e cognome');
    if (await rpc('set_my_name', { p_first: fn, p_last: ln })) {
      profile.name_confirmed = true;
      profile.full_name = fn + ' ' + ln;
      renderUser();
    }
  };
}

async function init(session) {
  if (!session) { profile = null; applyTheme(); return renderLogin(); }
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (error) { toast(error.message); return renderLogin(); }
  profile = data;
  applyTheme();
  if (!profile.name_confirmed) return renderNameForm();
  renderUser();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN' || event === 'SIGNED_OUT') {
    setTimeout(() => init(session), 0);
  }
});
</script>
