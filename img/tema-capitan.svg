<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1262"/><stop offset=".45" stop-color="#7a3fb8"/><stop offset=".8" stop-color="#d78ad0"/><stop offset="1" stop-color="#ffc0d6"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb2cf"/><stop offset=".55" stop-color="#f58bb4"/><stop offset=".56" stop-color="#c0608f"/><stop offset="1" stop-color="#8f3f78"/>
    </linearGradient>
  </defs>
  <rect width="400" height="800" fill="url(#sky)"/>
  <g fill="#fff"><circle cx="40" cy="60" r="1.8"/><circle cx="120" cy="30" r="1.4"/><circle cx="210" cy="80" r="1.8"/><circle cx="300" cy="40" r="1.4"/><circle cx="360" cy="110" r="1.8"/><circle cx="70" cy="150" r="1.2"/><circle cx="250" cy="170" r="1.4"/><circle cx="170" cy="140" r="1.2"/></g>
