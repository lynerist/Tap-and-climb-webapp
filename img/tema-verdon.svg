  <g transform="translate(72 200)"><circle cx="0" cy="0" r="4" fill="#d6453b"/><path d="M0 4 L0 20 M0 8 L-8 -4 M0 8 L8 14 M0 20 L-6 32 M0 20 L7 28" stroke="#d6453b" stroke-width="3" stroke-linecap="round" fill="none"/></g>
